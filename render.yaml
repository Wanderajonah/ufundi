services:
  - type: web
    name: ufundi-api
    runtime: node
    repo: https://github.com/Wanderajonah/ufundi
    branch: master
    rootDirectory: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SUPABASE_URL
        value: https://fqblwkktbucxngyxylnn.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COMMS_USERNAME
        sync: false
      - key: COMMS_API_KEY
        sync: false
      - key: COMMS_SENDER_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_OTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ufundi.ug
      - key: ADMIN_PASSWORD
        sync: false